<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<title>Okuma Günlüğü</title>
<meta name="description" content="Her gün bir sayfa: günlüğün, okuduğun sayfalar ve okuma notların.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Okuma Günlüğü">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0d0b" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f4efe6; --bg-glow:rgba(201,148,78,.16);
  --surface:#fffcf6; --surface2:#efe8dc; --surface3:#e6ddce;
  --line:rgba(40,30,20,.08); --line2:rgba(40,30,20,.14);
  --ink:#1d1915; --ink2:#3d362e; --muted:#7d7367; --muted2:#a89e91;
  --accent:#a65f2b; --accent2:#c98f4b; --accent-ink:#fffaf2;
  --accent-soft:rgba(166,95,43,.11);
  --heat0:#ece4d6; --heat1:#ecd2ac; --heat2:#ddae73; --heat3:#c4823f; --heat4:#9b5523;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px -12px rgba(60,40,20,.18);
  --shadow-lg:0 20px 60px -20px rgba(40,25,10,.35);
  --glass:rgba(255,252,246,.78); --h4ink:#fff; --pos:#3f8a5a; --wood1:#ae7b4c; --wood2:#7a4f2f; --shelf1:#e7dac6; --shelf2:#dccab0; --case:#7a5132; --desk1:#8a5a36; --desk2:#5e3b22;
  --m1:#7f8fb8; --m2:#8fa8a4; --m3:#c8b07a; --m4:#d9944a; --m5:#d4683c;
  --serif:"Fraunces",ui-serif,Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --r:22px; --r-sm:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --tabh:54px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f0d0b; --bg-glow:rgba(214,162,92,.10);
    --surface:#191613; --surface2:#221e1a; --surface3:#2c2722;
    --line:rgba(255,240,220,.07); --line2:rgba(255,240,220,.13);
    --ink:#f3ece2; --ink2:#d8cfc2; --muted:#9a8f82; --muted2:#6c645b;
    --accent:#dba663; --accent2:#e9bf86; --accent-ink:#1a130c;
    --accent-soft:rgba(219,166,99,.13);
    --heat0:#221e1a; --heat1:#3d2f20; --heat2:#6b4a28; --heat3:#a8743a; --heat4:#e0aa62;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-lg:0 24px 70px -20px rgba(0,0,0,.8);
    --glass:rgba(25,22,19,.8); --h4ink:#1a130c; --pos:#7cc493; --wood1:#5e4129; --wood2:#3a2818; --shelf1:#1f1b17; --shelf2:#171410; --case:#3a281b; --desk1:#4a3020; --desk2:#2b1c12;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f0d0b; --bg-glow:rgba(214,162,92,.10);
  --surface:#191613; --surface2:#221e1a; --surface3:#2c2722;
  --line:rgba(255,240,220,.07); --line2:rgba(255,240,220,.13);
  --ink:#f3ece2; --ink2:#d8cfc2; --muted:#9a8f82; --muted2:#6c645b;
  --accent:#dba663; --accent2:#e9bf86; --accent-ink:#1a130c;
  --accent-soft:rgba(219,166,99,.13);
  --heat0:#221e1a; --heat1:#3d2f20; --heat2:#6b4a28; --heat3:#a8743a; --heat4:#e0aa62;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 24px 70px -20px rgba(0,0,0,.8);
  --glass:rgba(25,22,19,.8); --h4ink:#1a130c; --pos:#7cc493; --wood1:#5e4129; --wood2:#3a2818; --shelf1:#1f1b17; --shelf2:#171410; --case:#3a281b; --desk1:#4a3020; --desk2:#2b1c12;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  background:linear-gradient(var(--bg),var(--bg) 8px,transparent 140px),radial-gradient(120% 60% at 100% 0%,var(--bg-glow),transparent 60%),radial-gradient(80% 50% at 0% 100%,var(--bg-glow),transparent 70%),var(--bg)}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:500;letter-spacing:-.01em;line-height:1.05}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:var(--serif)}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- iskelet ---------- */
#app{position:fixed;left:0;right:0;top:var(--appT,0px);bottom:0;height:var(--appH,auto);max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.screens{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:calc(var(--safe-t) + 12px) 18px 12px;opacity:0;pointer-events:none;transform:translateX(var(--dx,0px));transition:opacity .32s ease,transform .42s cubic-bezier(.2,.8,.2,1)}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex:none}
.top>div:first-child{min-width:0}
.top .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{font-size:clamp(30px,8.4vw,38px)}
.top h1 em{font-style:italic;color:var(--accent)}
.actions{display:flex;gap:8px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink2);transition:transform .15s}
.iconbtn:active{transform:scale(.92)}
.iconbtn .ic{width:19px;height:19px}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px 0 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600;font-size:14px}
.chip .ic{width:17px;height:17px;color:var(--accent)}
.chip.hot .ic{fill:var(--accent);stroke:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- sekme çubuğu ---------- */
.tabbar{flex:none;padding:0 6px max(4px,calc(var(--safe-b) - 18px));background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--line);transition:transform .25s ease,opacity .2s}
.tabbar-in{height:var(--tabh);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--muted2);transition:color .2s}
.tab .ic{width:22px;height:22px;stroke-width:1.7}
.tab.on{color:var(--accent)}
.tab.on .ic{stroke-width:2}

/* ---------- BUGÜN ---------- */
.week{flex:none;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;touch-action:pan-y}
.wd{height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:1px solid transparent;position:relative;transition:background .2s,border-color .2s}
.wd small{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.wd b{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1}
.wd i{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:transparent}
.wd.done i{background:var(--accent)}
.wd.today small{color:var(--accent)}
.wd.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wd.sel small{color:var(--bg);opacity:.7}
.wd.sel.done i{background:var(--accent2)}
.wd:disabled{opacity:.32}

.moodrow{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.moodrow .eyebrow{white-space:nowrap}
.moods{display:flex;gap:4px}
.mood{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted2);transition:transform .18s,background .2s,color .2s}
.mood svg{width:26px;height:26px}
.mood.on{background:var(--mc);color:#fff;transform:scale(1.08)}
.mood:active{transform:scale(.9)}

.editor{flex:1;min-height:120px;display:flex;flex-direction:column;padding:6px 6px 0;position:relative;overflow:hidden}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 0 4px;flex:none}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface2);gap:2px;position:relative}
.seg button{height:30px;padding:0 12px;white-space:nowrap;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);position:relative;transition:color .2s,background .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:2px}
.meta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.saved{opacity:0;transition:opacity .3s;color:var(--accent);display:inline-flex;align-items:center;gap:3px}
.saved.on{opacity:1}
.saved .ic{width:13px;height:13px;stroke-width:2.4}
@media (max-width:430px){.saved span{display:none}.saved .ic{width:16px;height:16px}}
.done-btn{display:none;height:30px;padding:0 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600}
textarea.page{flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;padding:10px 12px 16px;font-family:var(--serif);font-size:18px;line-height:1.62;color:var(--ink);
  background-image:linear-gradient(transparent calc(1.62em - 1px),var(--line) calc(1.62em - 1px),var(--line) 1.62em,transparent 1.62em);background-size:100% 1.62em;background-position:0 10px;background-attachment:local;overscroll-behavior:contain}
textarea.page::placeholder{color:var(--muted2);font-style:italic}

.reading{flex:none;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px}
.bookbtn{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left}
.bookbtn .t{min-width:0}
.bookbtn .t b{display:block;font-family:var(--serif);font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookbtn .t small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover{width:30px;height:44px;border-radius:3px 6px 6px 3px;flex:none;position:relative;display:grid;place-items:center;color:rgba(255,248,235,.92);font-family:var(--serif);font-size:12px;font-weight:600;letter-spacing:.02em;
  background:linear-gradient(90deg,rgba(0,0,0,.28) 0 3px,rgba(255,255,255,.12) 3px 4px,transparent 4px),linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 4px 10px -4px rgba(0,0,0,.45)}
.cover.empty{background:var(--surface2);color:var(--muted);box-shadow:none;border:1.5px dashed var(--line2)}
.cover.empty .ic{width:16px;height:16px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepbtn{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--ink2);transition:transform .12s}
.stepbtn:active{transform:scale(.88)}
.stepbtn .ic{width:16px;height:16px;stroke-width:2.2}
.ring{width:58px;height:58px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface2)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring.full .val{stroke:var(--accent2)}
.ring input{position:relative;width:44px;text-align:center;border:0;background:transparent;outline:0;font-family:var(--serif);font-size:20px;font-weight:500;padding:0;line-height:1;-moz-appearance:textfield}
.ring input::-webkit-outer-spin-button,.ring input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ring small{position:absolute;bottom:9px;font-size:8.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;pointer-events:none}
.ring input{margin-top:-6px}

/* yazarken: odak modu */
body.typing .week,body.typing .moodrow,body.typing .reading,body.typing .tabbar,body.typing #s-today .top .actions{display:none}
body.typing .done-btn{display:inline-flex;align-items:center}
body.typing #t-words{display:none}
body.typing #s-today .top h1{font-size:24px}
.today-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;row-gap:3px}
.today-top .eyebrow{grid-column:1/-1}
.today-top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepbtn.timer{flex:none;color:var(--accent)}
.stepbtn.timer.run{width:auto;min-width:58px;padding:0 10px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
/* kütüphane: kitaplık */
.library{display:flex;flex-direction:column;gap:0;padding:0 0 14px}
.shelf-t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 4px 8px;display:flex;gap:6px}
.shelf-t:first-child{margin-top:2px}
.shelf-t span{color:var(--accent)}
.shelf{position:relative;padding:18px 14px 0;
  background:radial-gradient(120% 80% at 50% -10%,rgba(255,214,150,.22),transparent 60%),linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.12) 38%,rgba(0,0,0,.22)),repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 1px,transparent 1px 86px),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 3px,transparent 3px 11px),var(--case);
  box-shadow:inset 9px 0 0 var(--wood2),inset -9px 0 0 var(--wood2),inset 10px 0 6px -2px rgba(0,0,0,.45),inset -10px 0 6px -2px rgba(0,0,0,.45)}
.shelf-t+.shelf{border-radius:12px 12px 0 0;box-shadow:inset 9px 0 0 var(--wood2),inset -9px 0 0 var(--wood2),inset 0 9px 0 var(--wood2),inset 10px 0 6px -2px rgba(0,0,0,.45),inset -10px 0 6px -2px rgba(0,0,0,.45),inset 0 16px 12px -6px rgba(0,0,0,.5)}
.shelf::after{content:"";display:block;position:relative;z-index:2;height:15px;margin:0 -14px;border-radius:2px 2px 4px 4px;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 22%,rgba(0,0,0,0) 60%,rgba(0,0,0,.35)),repeating-linear-gradient(91deg,rgba(0,0,0,.07) 0 2px,transparent 2px 9px,rgba(255,255,255,.05) 9px 10px,transparent 10px 23px),linear-gradient(180deg,var(--wood1),var(--wood2));
  box-shadow:0 12px 16px -8px rgba(0,0,0,.6)}
.books{display:flex;align-items:flex-end;gap:2px;height:150px;position:relative}
.books::after{content:"";position:absolute;left:-6px;right:-6px;bottom:0;height:10px;background:radial-gradient(60% 100% at 50% 100%,rgba(0,0,0,.35),transparent 70%);pointer-events:none}
.spine{position:relative;flex:none;border-radius:2px 3px 1px 1px;color:var(--ink,#f3e6cc);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 10px;transform-origin:bottom center;transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:1;
  background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.14) 14%,rgba(255,255,255,.03) 36%,rgba(0,0,0,0) 60%,rgba(0,0,0,.30)),linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 6%,rgba(0,0,0,0) 94%,rgba(0,0,0,.25)),linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.35),1px 0 0 rgba(0,0,0,.25),3px 2px 6px -2px rgba(0,0,0,.5)}
.spine:active{transform:translateY(-8px)}
.spine.lean{transform:rotate(-6deg);margin:0 6px 0 9px}
.spine .sp-top{font-size:7px;letter-spacing:-1px;color:#f2cf86;opacity:.9;min-height:9px}
.spine .sp-t{writing-mode:vertical-rl;font-family:var(--serif);font-size:12.5px;line-height:1.05;max-height:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
.spine .sp-a{font-size:7px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;max-width:100%;overflow:hidden;white-space:nowrap;padding:0 2px}
/* sırt biçimleri: 0 klasik altın şerit, 1 deri kabartma + etiket, 2 kumaş, 3 modern */
.spine.s0::before,.spine.s0::after{content:"";position:absolute;left:0;right:0;height:5px;border-top:1.5px solid rgba(242,207,134,.85);border-bottom:1.5px solid rgba(242,207,134,.85)}
.spine.s0::before{top:7%}.spine.s0::after{bottom:15%}
.spine.s1{background:linear-gradient(180deg,transparent 12%,rgba(0,0,0,.35) 12.5%,rgba(255,255,255,.18) 13.5%,transparent 15%,transparent 82%,rgba(0,0,0,.35) 82.5%,rgba(255,255,255,.18) 83.5%,transparent 85%),linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.16) 16%,rgba(0,0,0,0) 55%,rgba(0,0,0,.35)),linear-gradient(180deg,var(--c1),var(--c2))}
.spine.s1 .sp-t{background:rgba(0,0,0,.28);border:1px solid rgba(242,207,134,.55);color:#f2cf86;padding:6px 1px;border-radius:1px}
.spine.s2{background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),linear-gradient(90deg,rgba(0,0,0,.38),rgba(255,255,255,.10) 18%,rgba(0,0,0,0) 50%,rgba(0,0,0,.28)),linear-gradient(180deg,var(--c1),var(--c2))}
.spine.s2 .sp-t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.spine.s3 .sp-t{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:-.01em}
.spine.s3::after{content:"";position:absolute;bottom:9px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;border:1.5px solid currentColor;opacity:.55}
.spine.s3 .sp-a{margin-bottom:12px}
.spine i.rb{position:absolute;bottom:-10px;left:62%;width:6px;height:22px;background:linear-gradient(180deg,#c43d2b,#8e2417);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);z-index:3}
.bookend{flex:none;width:16px;height:66px;margin-left:6px;border-radius:2px 2px 0 0;background:linear-gradient(90deg,#2a2622,#6d655c 40%,#2a2622);box-shadow:2px 2px 6px rgba(0,0,0,.5);clip-path:polygon(0 0,40% 0,40% 82%,100% 82%,100% 100%,0 100%)}
/* şu an okunanlar: kapağı öne dönük */
.shelf.face .books{gap:16px;overflow-x:auto;overflow-y:visible;padding:0 2px;height:168px;scrollbar-width:none}
.shelf.face .books::-webkit-scrollbar{display:none}
.fo{position:relative;flex:none;width:88px;height:130px;margin-bottom:2px;transform:perspective(500px) rotateY(-9deg);transform-origin:left bottom;transition:transform .3s}

.fo .cover.foc{position:absolute;inset:0;width:100%;height:100%;border-radius:2px 6px 6px 2px;font-size:20px;box-shadow:0 10px 16px -6px rgba(0,0,0,.6)}
.fo .fo-pages{position:absolute;top:3px;bottom:3px;right:-5px;width:6px;border-radius:0 3px 3px 0;background:repeating-linear-gradient(180deg,#f6eedd 0 1px,#ddd0b6 1px 2px);transform:skewY(-20deg);transform-origin:left;box-shadow:1px 0 2px rgba(0,0,0,.3)}
.fo .fo-bar{position:absolute;left:4px;right:4px;bottom:-12px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}

/* rafa yerleşme animasyonu */
.library.enter .spine{animation:slot .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*22ms)}
.library.enter .fo{animation:slotf .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes slot{from{opacity:0;transform:translateY(-22px)}}
@keyframes slotf{from{opacity:0;transform:perspective(500px) rotateY(-50deg) translateX(-10px)}}
.spine.lean{animation-name:slotl!important}
@keyframes slotl{from{opacity:0;transform:translateY(-22px) rotate(0)}to{transform:rotate(-6deg)}}
/* 3B kitap */
.pull{position:fixed;inset:0;top:var(--appT,0px);bottom:var(--kb,0px);z-index:50;perspective:1400px}
.pull-bg{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 35%,rgba(60,40,20,.55),rgba(8,6,4,.85));backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.b3d{position:absolute;transform-style:preserve-3d;transform-origin:center}
.b3d .f{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.b3d .front{inset:0;transform:translateZ(calc(var(--d)/2));box-shadow:0 40px 70px -24px rgba(0,0,0,.8);border-radius:3px 10px 10px 3px}
.b3d .back{inset:0;transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:linear-gradient(180deg,var(--c1),var(--c2));border-radius:10px 3px 3px 10px}
.b3d .side{top:0;height:100%;width:var(--d);left:calc(50% - var(--d)/2);transform:rotateY(-90deg) translateZ(var(--hw));border-radius:3px}
.b3d .pages{top:2%;height:96%;width:calc(var(--d) - 4px);left:calc(50% - var(--d)/2 + 2px);background:repeating-linear-gradient(90deg,#f7efde 0 1px,#e2d5ba 1px 2px);transform:rotateY(90deg) translateZ(calc(var(--hw) - 4px))}
.b3d .topp{left:2%;width:94%;height:calc(var(--d) - 4px);top:calc(50% - var(--d)/2);background:repeating-linear-gradient(180deg,#f7efde 0 1px,#e2d5ba 1px 2px);transform:rotateX(90deg) translateZ(calc(var(--hh) - 2px))}
.cover.pc{width:100%;height:100%;border-radius:3px 10px 10px 3px;font-size:44px;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:22px 18px 22px 26px;text-align:center;
  background:linear-gradient(90deg,rgba(0,0,0,.35) 0 5px,rgba(255,255,255,.18) 5px 7px,transparent 7px 12%,transparent),linear-gradient(160deg,var(--c1),var(--c2))}
.pc .pc-t{font-family:var(--serif);font-size:24px;line-height:1.15;font-weight:500}
.pc .pc-a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;font-family:var(--sans);font-weight:600}
.pc img{border-radius:inherit}
.pull-info{position:absolute;left:24px;right:24px;text-align:center;color:#f6efe4;display:flex;flex-direction:column;align-items:center;gap:5px;opacity:0}
.pull-info h3{font-size:24px;line-height:1.15}
.pull-info p{font-size:13.5px;opacity:.78}
.pull-info .bar{width:70%;background:rgba(255,255,255,.15)}
.pull-info .btnrow{margin-top:10px;flex-wrap:wrap;justify-content:center}
.pull-info .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.stars-s{color:#f2cf86;letter-spacing:2px;opacity:1!important}
.stars-s span{opacity:.25}
/* notlar: ahşap masa ve kâğıtlar */
.desk{position:relative;min-height:100%;border-radius:18px;padding:22px 16px 34px;display:block;column-count:2;column-gap:14px;
  background:radial-gradient(90% 55% at 30% 0%,rgba(255,224,170,.28),transparent 60%),repeating-linear-gradient(178deg,rgba(0,0,0,.05) 0 2px,transparent 2px 13px,rgba(255,255,255,.035) 13px 15px,transparent 15px 31px),linear-gradient(160deg,var(--desk1),var(--desk2));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 20px 40px -20px rgba(0,0,0,.45)}
.desk.empty{display:flex;align-items:center;justify-content:center}
.desk.empty .empty-state{color:rgba(255,245,230,.8)}.desk.empty .serif{color:#fff3e0}.desk.empty svg.big{color:rgba(255,245,230,.5)}
.paper{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;min-height:70px;max-height:240px;margin:0 0 22px;break-inside:avoid;-webkit-column-break-inside:avoid;overflow:hidden;padding:22px 13px 14px;color:#2d251b;border-radius:2px;transform:rotate(var(--r,0deg));
  background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 30%),repeating-linear-gradient(180deg,transparent 0 21px,rgba(70,110,170,.16) 21px 22px) 0 34px/100% 100% no-repeat,#fbf5e6;
  box-shadow:0 1px 1px rgba(0,0,0,.18),0 14px 22px -12px rgba(0,0,0,.65),0 0 0 .5px rgba(0,0,0,.08)}
.paper:nth-child(3n)::after{content:"";position:absolute;right:0;bottom:0;width:22px;height:22px;background:linear-gradient(225deg,var(--desk2) 50%,#e9dfc8 50%);box-shadow:-2px -2px 4px rgba(0,0,0,.12)}
.paper .pin{position:absolute;top:-8px;left:50%;width:60px;height:20px;margin-left:-30px;background:rgba(255,246,214,.62);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.18);border-left:1px dashed rgba(0,0,0,.08);border-right:1px dashed rgba(0,0,0,.08)}
.paper small{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a0522d}
.paper .q{font-family:var(--serif);font-style:italic;font-size:14px;line-height:22px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.paper .src{font-size:11px;color:#6d5f4c;margin-top:auto;font-weight:600}
.desk.enter .paper{animation:drop .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes drop{from{opacity:0;transform:translateY(-26px) rotate(calc(var(--r,0deg)*3)) scale(1.04)}}
.paper.big{position:absolute;max-height:none;margin:0;padding:30px 24px 22px;transform:none;overflow:auto;gap:8px}
.paper.big .q{-webkit-line-clamp:unset;display:block;font-size:19px;line-height:30px;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.paper.big{background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 30%),repeating-linear-gradient(180deg,transparent 0 29px,rgba(70,110,170,.16) 29px 30px) 0 74px/100% 100% no-repeat,#fbf5e6}
.paper.big .src-b{font-family:var(--serif);font-size:16px;font-weight:500;color:#3b2f22}
.tchip .cnt{margin-left:6px;font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.tchip.sm{height:28px;font-size:12px;padding:0 10px}
/* sabit kitaplık */
.bookcase{position:relative;border-radius:14px 14px 6px 6px;box-shadow:0 22px 34px -20px rgba(0,0,0,.65);padding-top:10px;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 30%,rgba(0,0,0,.25)),linear-gradient(180deg,var(--wood1),var(--wood2))}
.bookcase .shelf{box-shadow:inset 9px 0 0 var(--wood2),inset -9px 0 0 var(--wood2),inset 10px 0 6px -2px rgba(0,0,0,.45),inset -10px 0 6px -2px rgba(0,0,0,.45),inset 0 16px 12px -8px rgba(0,0,0,.5)}
.bookcase .books{height:134px}
.case-empty{position:absolute;inset:10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;pointer-events:none}
.case-empty .serif{font-size:19px;font-style:italic;color:#f6e9d2;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.case-empty .btnrow{pointer-events:auto}
.spine.thin{padding:8px 0}
.spine.thin .sp-t{font-size:8px;letter-spacing:0}
.spine.thin.s1 .sp-t{padding:3px 0;border-width:.5px}
/* okuma masası */
.rdesk{flex:none;position:relative;border-radius:16px;padding:9px 14px 12px;overflow:hidden;
  background:radial-gradient(80% 90% at 20% 0%,rgba(255,224,170,.25),transparent 60%),repeating-linear-gradient(178deg,rgba(0,0,0,.05) 0 2px,transparent 2px 13px,rgba(255,255,255,.035) 13px 15px,transparent 15px 31px),linear-gradient(160deg,var(--desk1),var(--desk2));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.12),0 10px 24px -14px rgba(0,0,0,.6)}
.rdesk[hidden]{display:none}
.dk-top{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,240,220,.85)}
.dk-top small{font-size:10.5px;letter-spacing:.04em;text-transform:none;opacity:.7}
.dk-row{display:flex;gap:16px;align-items:flex-end;margin-top:8px;height:84px}
.dk{position:relative;width:56px;height:82px;flex:none;transform:perspective(420px) rotateX(10deg);transform-origin:bottom;transition:transform .25s}
.dk:active{transform:perspective(420px) rotateX(0) translateY(-6px)}
.dk .cover.dkc{width:100%;height:100%;font-size:16px;border-radius:2px 5px 5px 2px;box-shadow:0 12px 14px -6px rgba(0,0,0,.75),3px 0 0 -1px #efe5d0}
.dk-bar{position:absolute;left:3px;right:3px;bottom:-8px;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.dk-bar i{display:block;height:100%;background:#f2cf86}
.dk.more{display:grid;place-items:center;border-radius:6px;background:rgba(255,255,255,.14);color:#fff7ea;font-weight:700;transform:none}
.dk-empty{color:rgba(255,240,220,.8);font-size:12.5px;align-self:center;line-height:1.45}
/* kitap sayfası */
.bpage{z-index:38}
.bp-x{position:absolute;top:calc(var(--safe-t) + 14px);left:14px;z-index:3;background:rgba(255,255,255,.14);border-color:transparent;color:#fff;box-shadow:none}
.bp-panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;overflow:auto;overscroll-behavior:contain;box-shadow:0 -20px 50px -20px rgba(0,0,0,.6);padding-bottom:calc(var(--safe-b) + 14px)}
.bp-body{padding-top:20px}
.bp-body>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:.45s}
.bp-body>*:nth-child(2){animation-delay:.5s}.bp-body>*:nth-child(3){animation-delay:.55s}.bp-body>*:nth-child(n+4){animation-delay:.6s}
.bpage .bd-top .cover{display:none}
.bpage .b3d{cursor:zoom-in}
.bpage.full .b3d{cursor:zoom-out}
.bpage.full .pull-bg{background:rgba(6,4,3,.94)}
.cover.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.b3d .cover.pc{padding:12% 10% 12% 14%;gap:8%}
.b3d .pc .pc-t{font-size:calc(var(--hw) * .27);overflow-wrap:anywhere;hyphens:auto}
.b3d .pc .pc-a{font-size:calc(var(--hw) * .12)}
.bpage .bd-top h3{font-size:25px}
/* basılı tutma menüsü ve sürükleme */
.spine{-webkit-touch-callout:none;touch-action:pan-y}
.spine.lifted{transform:translateY(-14px) scale(1.07);z-index:6;box-shadow:0 18px 22px -10px rgba(0,0,0,.7),inset 0 0 0 .5px rgba(0,0,0,.35)}
.spine.ph{opacity:.22}
.drag-ghost{transition:none!important;box-shadow:0 26px 34px -12px rgba(0,0,0,.75)!important}
.drop-mark{position:fixed;width:3px;border-radius:3px;background:#f2cf86;box-shadow:0 0 12px #f2cf86;z-index:59;display:none;pointer-events:none}
.radial{position:fixed;inset:0;z-index:55;transition:opacity .2s;pointer-events:none}
.radial.live{pointer-events:auto}
.radial.out{opacity:0}
.rd-dim{position:absolute;inset:0;background:radial-gradient(circle at var(--x) var(--y),rgba(0,0,0,.05) 40px,rgba(8,6,4,.62) 190px);animation:fadein .25s both}
@keyframes fadein{from{opacity:0}}
.rd-title{position:absolute;left:50%;transform:translateX(-50%);max-width:80%;padding:8px 16px;border-radius:999px;background:var(--surface);color:var(--ink);font-family:var(--serif);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--shadow-lg);animation:fadein .3s both}
.rd-opt{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;animation:popin .42s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d)}
@keyframes popin{from{opacity:0;transform:translate(calc(-50% + var(--fx)),calc(-50% + var(--fy))) scale(.2)}}
.rd-opt span{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);box-shadow:0 12px 26px -8px rgba(0,0,0,.7),inset 0 0 0 1px var(--line2);transition:transform .15s}
.rd-opt:active span{transform:scale(.9)}
.rd-opt.done span{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink)}
.rd-opt.reading span{color:var(--accent)}
.rd-opt.del span{color:#d4473a}
.rd-opt small{font-size:11.5px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.9);white-space:nowrap}
.to-today{display:inline-flex;align-items:center;height:22px;padding:0 9px;margin-left:6px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font:700 10.5px var(--sans);letter-spacing:.04em;text-transform:none;vertical-align:2px}
.imp-ta{min-height:150px;height:150px;padding:12px 14px;resize:none;line-height:1.5;font-size:15px}
.imp-row{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.share-prev{width:100%;max-height:46vh;object-fit:contain;border-radius:14px;box-shadow:var(--shadow-lg);background:var(--surface2)}
.tag.ht{background:var(--accent-soft);color:var(--accent)}

/* ---------- TAKVİM ---------- */
.monthnav{flex:none;display:flex;align-items:center;justify-content:space-between}
.monthnav h2{font-size:22px}
.monthnav h2 span{color:var(--muted);font-style:italic}
.navbtns{display:flex;gap:6px}
.cal{flex:none;padding:10px 10px 8px}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding-bottom:6px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cd{height:clamp(34px,5.3vh,46px);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:500;position:relative;background:var(--hc,transparent);color:var(--ink);transition:transform .12s}
.cd:active{transform:scale(.92)}
.cd.h2,.cd.h3,.cd.h4{color:#fff}
.cd.h4{color:var(--h4ink)}
.cd.out{opacity:.28}
.cd.fut{color:var(--muted2)}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cd.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cd i{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--mc,var(--ink2))}
.legend{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);justify-content:flex-end;padding:8px 2px 0}
.legend b{width:11px;height:11px;border-radius:3px;display:inline-block}
.monthstat{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:8px 2px 0;flex:1}
.monthstat b{color:var(--ink);font-weight:600}
.cal-foot{display:flex;justify-content:space-between;align-items:center}
.preview{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 16px 12px;overflow:hidden}
.pv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:none}
.pv-head h3{font-size:21px}
.pv-head p{font-size:12px;color:var(--muted);margin-top:3px}
.pv-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--ink2);max-width:100%}
.tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag svg{width:15px;height:15px}
.pv-body{flex:1;min-height:0;overflow:auto;margin-top:10px;font-family:var(--serif);font-size:16px;line-height:1.6;color:var(--ink2);white-space:pre-wrap;overscroll-behavior:contain;-webkit-user-select:text;user-select:text}
.pv-body h4{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:12px 0 4px;font-weight:700}
.pv-body h4:first-child{margin-top:0}
.pv-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--muted);font-size:14px}
.pv-empty .serif{font-size:18px;color:var(--ink2);font-style:italic}
.btn{height:44px;padding:0 20px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn .ic{width:17px;height:17px}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:#c2412d;border:1px solid rgba(194,65,45,.3)}
.btn.sm{height:34px;padding:0 14px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.otd{margin-top:8px;flex:none;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.otd button{color:var(--accent);font-weight:600}

/* ---------- KİTAPLAR ---------- */
.hero{flex:none;padding:16px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--accent-soft);pointer-events:none}

.hero .info h3{font-size:21px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .info p{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.li .t{flex:1;min-width:0}
.li .t b{display:block;font-family:var(--serif);font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;color:var(--muted);padding:20px}
.empty-state .serif{font-size:20px;color:var(--ink2);font-style:italic}
.empty-state svg.big{width:64px;height:64px;color:var(--muted2);stroke-width:1.2}

/* ---------- RAPOR ---------- */
.rep-nav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rep-nav h2{font-size:19px;text-align:center;flex:1}
.rep-title{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;font-size:19px;font-weight:500;min-width:0}
.rep-title .ic{width:15px;height:15px;color:var(--muted)}
.kpis{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:12px 14px;min-width:0}
.kpi .eyebrow{font-size:10px}
.kpi b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(24px,7vw,30px);line-height:1.1;margin-top:4px}
.kpi b small{font-size:13px;font-family:var(--sans);color:var(--muted);font-weight:500;margin-left:3px}
.kpi p{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--pos)}.down{color:#c2412d}
.chart{flex:1;min-height:110px;padding:12px 12px 8px;display:flex;flex-direction:column}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;flex:none;gap:8px}
.chart-head span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-body{flex:1;min-height:0;position:relative;margin-top:8px}
.bars{position:absolute;inset:0 0 18px 0;display:flex;align-items:flex-end;gap:var(--bgap,6px)}
.bars button{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.bars button i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--heat2);min-height:2px;transition:height .45s cubic-bezier(.2,.8,.2,1),background .2s}
.bars button.goal i{background:var(--accent)}
.bars button.zero i{background:var(--surface2)}
.bars button.pick i{background:var(--ink)}
.xl{position:absolute;left:0;right:0;bottom:0;height:14px;display:flex;gap:var(--bgap,6px)}
.xl span{flex:1;text-align:center;font-size:9.5px;color:var(--muted);font-weight:600;min-width:0;overflow:visible;white-space:nowrap}
.goalline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--accent);opacity:.55;pointer-events:none}
.goalline span{position:absolute;right:0;top:-15px;font-size:9.5px;color:var(--accent);font-weight:700}
.moodcard{flex:none;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mdist{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2);gap:2px}
.mdist i{display:block;height:100%}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.mrow b{color:var(--ink);font-weight:600}
.mrow .avg{display:flex;align-items:center;gap:6px}
.mrow .avg svg{width:20px;height:20px}
.foot{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.foot div{padding:9px 10px;text-align:center;border-radius:16px;background:var(--surface2)}
.foot b{display:block;font-family:var(--serif);font-weight:500;font-size:18px}
.foot small{font-size:10.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- alt pencere (sheet) ---------- */
.scrim{position:fixed;inset:0;top:var(--appT,0px);bottom:var(--kb,0px);background:rgba(10,8,6,.45);z-index:40;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:41;max-width:560px;margin:0 auto;max-height:calc(var(--appH,100%) - var(--safe-t) - 24px);display:flex;flex-direction:column;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:var(--shadow-lg);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);padding-bottom:calc(var(--safe-b) + 12px)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line2);margin:9px auto 0;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px;flex:none;gap:10px}
.sh-head h2{font-size:24px}
.sh-body{padding:6px 18px 4px;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px;min-height:0}
.sh-body>*{flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp{height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;font-size:16px;outline:0;width:100%;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
.set-group{display:flex;flex-direction:column;border-radius:18px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:54px;text-align:left;width:100%}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .l{display:flex;align-items:center;gap:12px;min-width:0}
.set-row .l .ic{color:var(--accent)}
.set-row .l small{display:block;font-size:12px;color:var(--muted)}
.set-row .r{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.switch{width:46px;height:28px;border-radius:99px;background:var(--surface3);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px)}
.mini-step{display:flex;align-items:center;gap:8px}
.mini-step b{min-width:34px;text-align:center;font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:500}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--bg);border:1px solid var(--line);text-align:left;width:100%}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick .t{flex:1;min-width:0}
.pick .t b{display:block;font-family:var(--serif);font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .t small{font-size:12px;color:var(--muted)}
.pick .ic.ok{color:var(--accent);stroke-width:2.4}
.bd-top{display:flex;gap:16px;align-items:center}
.bd-top .cover{width:78px;height:114px;font-size:24px;border-radius:4px 10px 10px 4px}
.bd-top h3{font-size:22px;line-height:1.15}
.bd-top p{font-size:13px;color:var(--muted);margin-top:3px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{padding:10px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:center}
.stats3 b{display:block;font-family:var(--serif);font-size:19px;font-weight:500}
.stats3 small{font-size:10.5px;color:var(--muted)}
.note{padding:12px 14px;border-radius:16px;background:var(--bg);border:1px solid var(--line);text-align:left;width:100%}
.note small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.note p{font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ink2);margin-top:4px;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.note mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 1px}
.sec-t{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 2px -6px}
.search-wrap{position:relative}
.search-wrap .ic{position:absolute;left:14px;top:14px;color:var(--muted)}
.search-wrap .inp{padding-left:42px}

/* ---------- kilit, karşılama, bildirim ---------- */
.overlay{position:fixed;inset:0;top:var(--appT,0px);bottom:var(--kb,0px);z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(var(--safe-t) + 20px) 28px calc(var(--safe-b) + 20px);text-align:center;
  background:radial-gradient(90% 50% at 50% 0%,var(--bg-glow),transparent 70%),var(--bg)}
.overlay[hidden]{display:none}
.logo{width:84px;height:84px;border-radius:22px;box-shadow:var(--shadow-lg)}
.overlay h1{font-size:40px}
.overlay h1 em{color:var(--accent)}
.overlay .lead{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);max-width:300px}
.ob-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:left}
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.goals button{height:44px;border-radius:13px;background:var(--surface);border:1px solid var(--line2);font-weight:600}
.goals button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.goals .goal-inp{height:44px;border-radius:13px;text-align:center;font-weight:600;padding:0 6px;background:var(--surface);-moz-appearance:textfield}
.goals .goal-inp.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.goals .goal-inp::placeholder{color:var(--muted);font-weight:600}
.goal-num{width:52px;height:34px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:center;font-family:var(--serif);font-size:18px;font-weight:500;color:var(--ink);outline:0;padding:0;-moz-appearance:textfield}
.goal-num:focus{border-color:var(--accent);background:var(--surface)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dots{display:flex;gap:16px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink2);transition:background .15s}
.dots i.f{background:var(--ink)}
.dots.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;margin-top:10px}
.keypad button{width:72px;height:72px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-family:var(--serif);font-size:28px;box-shadow:var(--shadow)}
.keypad button:active{background:var(--surface2)}
.keypad button.k0{grid-column:2}
.keypad button.kx{background:none;border:0;box-shadow:none;display:grid;place-items:center}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);z-index:80;transform:translate(-50%,calc(-100% - var(--safe-t) - 24px));opacity:0;transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .25s;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.cover.big{width:70px;height:102px;font-size:22px;border-radius:4px 10px 10px 4px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.cover .emo{font-size:1.25em;line-height:1}
.typechips{display:flex;gap:6px;overflow-x:auto;flex:none;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.typechips:empty{display:none}
.typechips::-webkit-scrollbar{display:none}
.tchip{height:32px;padding:0 12px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink2);flex:none;transition:background .2s,color .2s}
.tchip.on{background:var(--ink);color:var(--bg)}
.sr-msg{text-align:center;font-size:13px;padding:6px}
.pick.sr .cover{width:34px;height:50px}
.cover-prev{display:flex;align-items:center;gap:12px}
.cover-prev .cover{width:44px;height:64px}
.cover-prev .muted{flex:1;font-size:13px}
.seg.mini button{height:26px;padding:0 10px;font-size:12px}
.ilist{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}
.ilist::-webkit-scrollbar{display:none}
.tsum{display:flex;gap:6px;flex-wrap:wrap}
.irow{display:flex;align-items:center;gap:10px;text-align:left;width:100%;flex:none}
.irow .cover{width:24px;height:35px;font-size:9px}
.irow .t{flex:1;min-width:0}
.irow .t b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .bar{height:5px;margin-top:5px}
.irow .v{font-family:var(--serif);font-size:16px;flex:none}
.li .pct small{font-family:var(--sans);font-size:11px;color:var(--muted)}
.tag .emo{font-size:13px}
.trow{gap:8px}
.trow .ty-emo{width:50px;height:40px;text-align:center;font-size:20px;padding:0;flex:none}
.trow .ty-name{flex:1;height:40px}
.ty-lock{width:40px;display:grid;place-items:center;color:var(--muted2);flex:none}
/* ---------- genel hareket ---------- */
html,body,button,input,textarea,.screen,.sheet{touch-action:manipulation}
.week{touch-action:pan-y}
.btn:active,.iconbtn:active,.chip:active,.tchip:active,.set-row:active,.pick:active{transform:scale(.96)}
.tchip,.set-row,.pick{transition:transform .15s,background .2s,color .2s}
.tab.on .ic{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.mood.on svg{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{40%{transform:scale(1.25)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}
.sheet.on .sh-body>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.sheet.on .sh-body>*:nth-child(2){animation-delay:.04s}.sheet.on .sh-body>*:nth-child(3){animation-delay:.08s}.sheet.on .sh-body>*:nth-child(4){animation-delay:.12s}.sheet.on .sh-body>*:nth-child(n+5){animation-delay:.16s}
/* ---------- editör araçları ---------- */
.ed-tools{display:flex;gap:4px;margin-left:auto}
.mini-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.mini-ic .ic{width:18px;height:18px}
.mini-ic:active{background:var(--surface2)}
.mini-ic.rec{color:#fff;background:#d4473a;animation:pulse 1.4s infinite}
.words-o{position:absolute;right:14px;bottom:8px;font-size:11px;color:var(--muted2);pointer-events:none;font-variant-numeric:tabular-nums}
/* ---------- Plus ---------- */
.plus-b{display:inline-block;vertical-align:1px;margin-left:4px;font:800 8.5px/1 var(--sans);letter-spacing:.1em;padding:3px 5px;border-radius:5px;background:linear-gradient(135deg,#f0d18d,#b8862f);color:#2a1a06}
.plus-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px;border-radius:20px;text-align:left;width:100%;color:#f8ecd6;
  background:radial-gradient(120% 140% at 100% 0%,rgba(240,209,141,.35),transparent 55%),linear-gradient(135deg,#2a1d13,#120c08);box-shadow:inset 0 0 0 1px rgba(240,209,141,.25),var(--shadow)}
.plus-card b{font-family:var(--serif);font-weight:500;font-size:19px;display:block}
.plus-card b em{color:#f0d18d}
.plus-card small{font-size:12px;opacity:.75}
.pc-badge{flex:none;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;background:linear-gradient(135deg,#f0d18d,#b8862f);color:#2a1a06}
.pw-hero{text-align:center;padding:6px 0 2px}
.pw-crown{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:18px;font-size:26px;color:#2a1a06;background:linear-gradient(135deg,#f6dc9f,#b8862f);box-shadow:0 12px 30px -10px rgba(184,134,47,.7)}
.pw-hero h3{font-size:22px;margin-top:12px}
.pw-hero p{color:var(--muted);font-size:13.5px;margin-top:6px}
.pw-list{display:flex;flex-direction:column;gap:2px}
.pw-row{display:flex;gap:12px;align-items:flex-start;padding:9px 6px;border-radius:12px}
.pw-row.on{background:var(--accent-soft)}
.pw-row .ic{color:#b8862f;margin-top:2px}
.pw-row b{display:block;font-size:14px;font-weight:600}
.pw-row small{font-size:12px;color:var(--muted)}
.pw-row.soon{opacity:.75}
.pw-plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-plan{position:relative;padding:14px 12px;border-radius:16px;border:1.5px solid var(--line2);background:var(--bg);display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.pw-plan.best{border-color:#c99a42}
.pw-plan i{position:absolute;top:-9px;right:10px;font-style:normal;font-size:10px;font-weight:700;padding:3px 7px;border-radius:99px;background:#c99a42;color:#fff}
.pw-plan b{font-size:13px;color:var(--muted)}
.pw-plan span{font-family:var(--serif);font-size:22px}
/* ---------- barkod, yazı tanıma ---------- */
.row-i{display:flex;gap:8px;align-items:center}
.iconbtn.big{width:48px;height:48px;border-radius:14px;flex:none}
.scan{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;left:12%;right:12%;top:28%;bottom:28%;border:2px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-line{position:absolute;left:14%;right:14%;top:30%;height:2px;background:#ff5a3c;box-shadow:0 0 12px #ff5a3c;animation:scanl 1.8s ease-in-out infinite alternate}
@keyframes scanl{to{top:70%}}
.sr-help{font-size:12px;color:var(--muted);line-height:1.5;padding:4px 4px 0;display:flex;flex-direction:column;gap:6px}
.sr-help a{color:var(--accent);font-weight:600}
.ocr-img{max-height:34vh;width:100%;object-fit:contain;border-radius:14px;background:var(--surface2)}
.ocr-prog{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden}
.ocr-prog i{display:block;height:100%;width:3%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.dig{display:flex;align-items:center;gap:5px;font-size:12px!important;color:var(--accent)!important;font-weight:600}
.dig .ic{width:14px;height:14px}
/* ---------- yıldızlar ---------- */
.stars{display:flex;gap:2px;margin-top:6px}
.stars button{font-size:22px;line-height:1;color:var(--surface3);padding:2px;transition:color .2s}
.stars button.on{color:#e0a83e}
/* ---------- okuyucu ---------- */
.reader{position:fixed;inset:0;top:var(--appT,0px);bottom:var(--kb,0px);z-index:70;background:var(--rbg);color:var(--rfg);display:flex;flex-direction:column;padding-top:var(--safe-t)}
.rd-top{display:flex;align-items:center;gap:10px;padding:8px 12px;flex:none}
.rd-top .iconbtn{background:transparent;border-color:transparent;box-shadow:none;color:inherit;font-family:var(--serif);font-size:17px}
.rd-t{flex:1;min-width:0;text-align:center}
.rd-t b{display:block;font-family:var(--serif);font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-t small{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.rd-view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 14px;overflow:hidden}
.rd-view canvas{box-shadow:0 4px 20px rgba(0,0,0,.18);background:#fff}
.rd-zone{position:absolute;top:70px;bottom:70px;width:24%;z-index:2}
.rd-zone.l{left:0}.rd-zone.r{right:0}
.rd-bot{display:flex;align-items:center;gap:12px;padding:8px 18px calc(var(--safe-b) + 10px);flex:none}
.rd-bot input{flex:1;accent-color:#b8862f}
.rd-bot small{font-size:12px;opacity:.65;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
/* ---------- hedefler ve rozetler ---------- */
.streak-hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;color:#fff6ea;background:radial-gradient(100% 140% at 0% 0%,rgba(255,170,90,.45),transparent 60%),linear-gradient(135deg,#7a3518,#2a120a)}
.streak-hero .flame .ic{width:40px;height:40px;fill:#ffb35c;stroke:#ffb35c}
.streak-hero b{font-family:var(--serif);font-size:38px;font-weight:500;line-height:1;display:block}
.streak-hero span{font-size:13px;opacity:.85}
.streak-hero small{margin-left:auto;font-size:12px;opacity:.8}
.goal{padding:12px 14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.goal.won{border-color:#c99a42;background:linear-gradient(135deg,rgba(240,209,141,.18),transparent)}
.g-h{display:flex;justify-content:space-between;align-items:center}
.g-h b{font-size:14.5px;font-weight:600}
.g-x{color:var(--muted2)}.g-x .ic{width:16px;height:16px}
.goal .bar{margin-top:8px}
.g-f{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.g-f b{color:var(--ink)}
.typechips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:12px 6px;border-radius:16px;background:var(--bg);border:1px solid var(--line);filter:grayscale(1);opacity:.45}
.badge.ok{filter:none;opacity:1;background:linear-gradient(160deg,rgba(240,209,141,.22),transparent 70%),var(--bg);border-color:rgba(201,154,66,.45)}
.badge span{font-size:26px}
.badge b{font-size:12px;font-weight:700}
.badge small{font-size:10px;color:var(--muted);line-height:1.3}
/* ---------- analiz ---------- */
.ilist.an{gap:2px}
.an-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.an-row span{font-size:13px;color:var(--ink2)}
.an-row small{display:block;font-size:11px;color:var(--muted)}
.an-row b{font-family:var(--serif);font-weight:500;font-size:17px;white-space:nowrap}
.an-row.col{flex-direction:column;align-items:flex-start}
.hours{display:flex;align-items:flex-end;gap:2px;height:34px;padding-top:6px}
.hours i{flex:1;height:calc(var(--v)*100% + 2px);border-radius:2px;background:linear-gradient(180deg,var(--accent2),var(--accent));opacity:calc(.25 + var(--v)*.75)}
.hours-l{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);padding-bottom:4px}
/* ---------- özet hikâyesi ---------- */
.story{position:fixed;inset:0;top:var(--appT,0px);bottom:var(--kb,0px);z-index:75;color:#fbf2e4;background:#120c08;overflow:hidden}
.st-bars{position:absolute;top:calc(var(--safe-t) + 10px);left:12px;right:12px;display:flex;gap:4px;z-index:3}
.st-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.st-bars i b{display:block;height:100%;width:0;background:#fff}
.st-bars i.done b{width:100%}
.st-bars i.run b{animation:stbar var(--dur,5s) linear forwards}
@keyframes stbar{to{width:100%}}
.st-x{position:absolute;top:calc(var(--safe-t) + 22px);right:12px;z-index:3;color:#fff;width:40px;height:40px;display:grid;place-items:center}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:14px;padding:80px 30px 60px;opacity:0;pointer-events:none;transition:opacity .45s;
  background:radial-gradient(100% 70% at 80% 10%,hsla(calc(28 + var(--hue)),75%,55%,.45),transparent 60%),radial-gradient(90% 60% at 0% 100%,hsla(calc(10 + var(--hue)),70%,40%,.45),transparent 65%),linear-gradient(160deg,#2a1a10,#0d0805)}
.sl.on{opacity:1;pointer-events:auto}
.sl.on>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.sl.on>*:nth-child(2){animation-delay:.12s}.sl.on>*:nth-child(3){animation-delay:.24s}.sl.on>*:nth-child(4){animation-delay:.36s}
.st-k{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#f0d18d}
.sl h2{font-size:52px;line-height:1.02}
.sl h2 em{color:#f0d18d}
.sl h3{font-size:26px}
.sl p{font-size:16px;opacity:.85;line-height:1.5}
.st-big{font-family:var(--serif);font-weight:500;font-size:96px;line-height:1;color:#f0d18d;font-variant-numeric:tabular-nums}
.st-mid{font-family:var(--serif);font-weight:500;font-size:60px;line-height:1}
.st-covers{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.cover.stc{width:72px;height:106px;font-size:18px;border-radius:3px 8px 8px 3px;box-shadow:0 12px 24px -10px rgba(0,0,0,.8)}
.st-one .cover.stc.big{width:150px;height:222px;font-size:34px}
.sl blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:24px;line-height:1.45}
.st-face svg{width:90px;height:90px}
.st-tags{display:flex;flex-wrap:wrap;gap:8px}
.st-tags span{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.12);font-size:14px}

.celebrate{font-size:44px;line-height:1}

@media (max-height:700px){
  .screen{gap:9px;padding-top:calc(var(--safe-t) + 8px)}
  .wd{height:50px}
  .top h1{font-size:28px}
  .reading{padding:7px 8px 7px 10px}
  .ring{width:52px;height:52px}
  .kpi{padding:9px 12px}
  .kpi b{font-size:23px}
  .moodcard{padding:9px 12px;gap:6px}
  .hero .cover{width:58px;height:86px}
  .hero{padding:12px}
  .kpis{gap:8px}
  .kpi p{display:none}
  .kpi b{margin-top:2px}
  #r-mood .mrow:last-child{display:none}
  .foot div{padding:6px 8px}
  .chart{min-height:130px}
}
@media (max-height:600px){ .moodrow .eyebrow{display:none} .moodrow{justify-content:center} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="screens">

    <!-- BUGÜN -->
    <section class="screen on" id="s-today" aria-label="Bugün">
      <header class="top today-top">
        <div class="eyebrow" id="t-eyebrow"></div>
        <h1 id="t-date"></h1>
        <div class="actions">
          <button class="chip" id="t-streak" aria-label="Seri"></button>
          <button class="iconbtn" id="t-theme" aria-label="Tema"></button>
          <button class="iconbtn" id="t-settings" aria-label="Ayarlar"></button>
        </div>
      </header>
      <nav class="week" id="t-week" aria-label="Hafta"></nav>
      <div class="moodrow">
        <span class="eyebrow">Günün nasıldı?</span>
        <div class="moods" id="t-moods"></div>
      </div>
      <section class="card editor">
        <div class="editor-head">
          <div class="seg" id="t-seg">
            <button data-k="text" class="on">Günlük</button>
            <button data-k="notes">Okuma notları</button>
          </div>
          <div class="ed-tools"><button class="mini-ic" id="t-ocr" aria-label="Fotoğraftan alıntı"></button><button class="mini-ic" id="t-voice" aria-label="Sesle yaz"></button></div>
          <div class="meta">
            <span class="saved" id="t-saved"></span>
            <button class="done-btn" id="t-done">Bitti</button>
          </div>
        </div>
        <textarea class="page" id="t-page" spellcheck="true" autocapitalize="sentences"></textarea>
        <span class="words-o" id="t-words"></span>
      </section>
      <section class="card reading">
        <button class="bookbtn" id="t-book"></button>
        <button class="stepbtn timer" id="t-timer" aria-label="Okuma süresi"></button>
        <div class="stepper">
          <button class="stepbtn" id="t-minus" aria-label="Sayfa azalt"></button>
          <label class="ring" id="t-ring">
            <svg viewBox="0 0 58 58"><circle class="trk" cx="29" cy="29" r="25" fill="none" stroke-width="4"/><circle class="val" cx="29" cy="29" r="25" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="157.08" stroke-dashoffset="157.08"/></svg>
            <input id="t-pages" type="number" inputmode="numeric" min="0" max="9999" aria-label="Okunan sayfa">
            <small>sayfa</small>
          </label>
          <button class="stepbtn" id="t-plus" aria-label="Sayfa artır"></button>
        </div>
      </section>
    </section>

    <!-- TAKVİM -->
    <section class="screen" id="s-cal" aria-label="Takvim">
      <header class="top">
        <div><div class="eyebrow">Geçmiş sayfalar</div><h1>Takvim</h1></div>
        <div class="actions"><button class="iconbtn" id="c-search" aria-label="Ara"></button></div>
      </header>
      <div class="monthnav">
        <h2 class="serif" id="c-title"></h2>
        <div class="navbtns">
          <button class="iconbtn" id="c-prev" aria-label="Önceki ay"></button>
          <button class="iconbtn" id="c-next" aria-label="Sonraki ay"></button>
        </div>
      </div>
      <section class="card cal">
        <div class="cal-h" id="c-wh"></div>
        <div class="cal-g" id="c-grid"></div>
        <div class="cal-foot">
          <div class="monthstat" id="c-stat"></div>
          <div class="legend"><span>az</span><b style="background:var(--heat1)"></b><b style="background:var(--heat2)"></b><b style="background:var(--heat3)"></b><b style="background:var(--heat4)"></b><span>çok</span></div>
        </div>
      </section>
      <section class="card preview" id="c-preview"></section>
    </section>

    <!-- KÜTÜPHANE -->
    <section class="screen" id="s-books" aria-label="Kütüphane">
      <header class="top">
        <div><div class="eyebrow" id="b-eyebrow">Kütüphanen</div><h1>Kütüphane</h1></div>
        <div class="actions"><button class="iconbtn" id="b-import" aria-label="Listeden içe aktar"></button><button class="iconbtn" id="b-add" aria-label="Ekle"></button></div>
      </header>
      <div class="typechips" id="b-filter"></div>
      <div class="typechips" id="b-types"></div>
      <div class="list" id="b-list"></div>
      <div class="rdesk" id="b-desk"></div>
    </section>

    <!-- RAPOR -->
    <section class="screen" id="s-rep" aria-label="Rapor">
      <header class="top">
        <div><div class="eyebrow">Okuma ve yazma</div><h1>Rapor</h1></div>
        <div class="seg" id="r-seg">
          <button data-k="day">Gün</button>
          <button data-k="week" class="on">Hafta</button>
          <button data-k="month">Ay</button>
          <button data-k="year">Yıl</button>
        </div>
      </header>
      <div class="rep-nav">
        <button class="iconbtn" id="r-prev" aria-label="Önceki"></button>
        <button class="rep-title serif" id="r-title" aria-label="Dönem özetini paylaş"></button>
        <button class="iconbtn" id="r-next" aria-label="Sonraki"></button>
      </div>
      <div class="kpis" id="r-kpis"></div>
      <section class="card chart">
        <div class="chart-head"><div class="seg mini" id="r-mode"><button data-m="days" class="on">Günler</button><button data-m="items">Okumalar</button><button data-m="an">Analiz</button></div><span id="r-pick"></span></div>
        <div class="chart-body" id="r-chart"></div>
      </section>
      <section class="card moodcard" id="r-mood"></section>
      <div class="foot" id="r-foot"></div>
    </section>
  </div>

  <nav class="tabbar" aria-label="Sekmeler">
    <div class="tabbar-in" id="tabs">
      <button class="tab on" data-s="today"></button>
      <button class="tab" data-s="cal"></button>
      <button class="tab" data-s="books"></button>
      <button class="tab" data-s="rep"></button>
    </div>
  </nav>
</div>

<div class="overlay" id="ob" hidden></div>
<div class="overlay" id="lock" hidden></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
