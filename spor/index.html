<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADIM · Spor Programı</title>
<meta name="description" content="Adım adım, sana özel haftalık spor programı.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ADIM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060607">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#060607; --bg2:#0b0b0d; --surface:#111114; --surface2:#18181d; --surface3:#202027;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --ink:#f5f5f7; --ink2:#d6d6dc; --muted:#8e8e98; --muted2:#5f5f69;
  --red:#ff3b30; --red2:#d4141f; --orange:#ff7a1a; --amber:#ffb23f; --ok:#ff9f2e;
  --grad:linear-gradient(135deg,#ff2d2d 0%,#ff5a1f 55%,#ff8a1f 100%);
  --grad-soft:linear-gradient(135deg,rgba(255,45,45,.18),rgba(255,138,31,.10));
  --display:"Barlow Condensed",ui-sans-serif,system-ui,sans-serif;
  --body:"Barlow",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --r:20px; --tabh:64px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
:root.short-vp{--safe-b:6px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
svg{display:block}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:1}
p{margin:0}
.muted{color:var(--muted)} .tiny{font-size:12px} .small{font-size:13px}
.up{text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:11px}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- uygulama iskeleti ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 14px) 16px calc(var(--tabh) + var(--safe-b) + 24px)}
.screen::-webkit-scrollbar{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.topbar h1{font-size:34px;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:8px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 20px -6px rgba(255,59,48,.7)}
.brand b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:.14em}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* sekme çubuğu */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tabh) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(10,10,12,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted2);font-size:10.5px;font-weight:600;letter-spacing:.02em;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--orange);filter:drop-shadow(0 0 8px rgba(255,122,26,.55))}
.tab.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}

/* ---------- kartlar ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.card+.card,.card+.sec,.sec+.card{margin-top:12px}
.sec{margin:24px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:21px;text-transform:uppercase;letter-spacing:.04em}
.sec .link{color:var(--orange);font-weight:600;font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.pri{background:rgba(255,59,48,.14);border-color:rgba(255,59,48,.35);color:#ff8a80}
.chip.sec{background:rgba(255,122,26,.12);border-color:rgba(255,122,26,.3);color:#ffb070}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.chip.warn{background:rgba(255,178,63,.12);border-color:rgba(255,178,63,.3);color:var(--amber)}
.chip.dim{opacity:.45}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grad);flex:none}

/* butonlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:16px;font-weight:700;font-size:16px;background:var(--surface2);border:1px solid var(--line2);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 30px -10px rgba(255,59,48,.8),inset 0 1px 0 rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-size:20px;font-weight:800}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:#ff6b62;border-color:rgba(255,59,48,.35)}
.btn svg{width:20px;height:20px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* ---------- ana ekran ---------- */
.hello{margin-bottom:14px}
.hello .up{color:var(--orange)}
.hello h1{font-size:40px;text-transform:uppercase;margin-top:4px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:600}
.wd b{font-family:var(--display);font-size:19px;color:var(--ink2);font-weight:700}
.wd i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px}
.wd.train i{border:2px solid rgba(255,122,26,.55)}
.wd.done i{background:var(--grad);border:0;color:#fff;box-shadow:0 0 12px rgba(255,90,31,.6)}
.wd.missed i{border:2px solid rgba(255,59,48,.35);color:#ff6b62}
.wd.rest i{background:var(--surface3)}
.wd.today{background:var(--surface2);border-color:rgba(255,122,26,.5);color:var(--ink)}
.wd.today b{color:var(--ink)}

.hero{border-radius:26px;padding:20px;position:relative;overflow:hidden;background:#140707;border:1px solid rgba(255,90,31,.3);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,90,31,.55),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(212,20,31,.55),transparent 60%);z-index:-2}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);z-index:-1}
.hero .tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hero h2{font-size:44px;text-transform:uppercase;margin:12px 0 2px;line-height:.92}
.hero .sub{font-size:16px;color:#ffd2b8;font-weight:600}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.hero .stat{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}
.hero .stat .num{font-size:26px;line-height:1}
.hero .stat .tiny{color:#ffcfb5;opacity:.85}
.hero .bm{position:absolute;right:-6px;top:6px;width:120px;opacity:.95;pointer-events:none}
.hero .bm svg{width:100%}
.hero.rest{background:var(--surface);border-color:var(--line2)}
.hero.rest::before{background:radial-gradient(100% 80% at 100% 0%,rgba(255,122,26,.18),transparent 60%)}
.hero.done::before{background:radial-gradient(120% 90% at 100% 0%,rgba(255,138,31,.5),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(255,59,48,.35),transparent 60%)}

.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.tile .num{font-size:32px;line-height:1;margin:6px 0 2px}
.tile .up{color:var(--muted)}
.tile .bar{height:6px;border-radius:3px;background:var(--surface3);overflow:hidden;margin-top:8px}
.tile .bar i{display:block;height:100%;background:var(--grad);border-radius:3px}

.banner{border-radius:18px;padding:14px;background:linear-gradient(135deg,rgba(255,59,48,.16),rgba(255,122,26,.08));border:1px solid rgba(255,90,31,.35);margin-bottom:12px}
.banner h3{font-size:20px;text-transform:uppercase;margin-bottom:4px}
.banner .btnrow{margin-top:12px}

.quote{font-family:var(--display);font-size:22px;font-weight:700;font-style:italic;line-height:1.1;text-transform:uppercase}

/* ---------- listeler ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.item .thumb{width:74px;height:62px;border-radius:12px;overflow:hidden;background:#0d0d10;flex:none}
.item .thumb svg{width:100%;height:100%}
.item h4{margin:0;font-size:16px;font-weight:700;line-height:1.15}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.item .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.item.dim{opacity:.5}
.diff{display:inline-flex;gap:2px;align-items:flex-end}
.diff i{width:4px;border-radius:2px;background:var(--surface3)}
.diff i:nth-child(1){height:6px}.diff i:nth-child(2){height:9px}.diff i:nth-child(3){height:12px}.diff i:nth-child(4){height:15px}.diff i:nth-child(5){height:18px}
.diff i.on{background:var(--grad)}
.swapbtn{font-size:12px;font-weight:700;color:var(--orange);padding:6px 10px;border-radius:10px;background:rgba(255,122,26,.1);border:1px solid rgba(255,122,26,.25)}

.daycard{display:flex;gap:14px;align-items:stretch;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.daycard .date{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:var(--surface2)}
.daycard .date b{font-family:var(--display);font-size:26px;line-height:1}
.daycard .date span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.daycard.train .date{background:var(--grad-soft);border:1px solid rgba(255,90,31,.35)}
.daycard.today{border-color:rgba(255,122,26,.6);box-shadow:0 0 0 1px rgba(255,122,26,.25),0 10px 30px -18px rgba(255,90,31,.8)}
.daycard h4{margin:0;font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;line-height:1}
.daycard .meta{font-size:13px;color:var(--muted);margin-top:4px}
.daycard.rest{padding:10px 14px;opacity:.75}
.daycard.rest h4{font-size:17px;color:var(--ink2)}
.status{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:8px;align-self:flex-start}
.status.done{background:var(--grad);color:#fff}
.status.missed{background:rgba(255,59,48,.14);color:#ff6b62}
.status.today{background:rgba(255,122,26,.15);color:var(--orange)}

.phasebar{display:grid;grid-template-columns:2fr 2fr 4fr 4fr 2fr;gap:4px;margin:12px 0 6px}
.phasebar i{height:8px;border-radius:4px;background:var(--surface3);position:relative;overflow:hidden}
.phasebar i.on{background:var(--grad)}
.phasebar i.cur{background:var(--surface3)}
.phasebar i.cur::after{content:"";position:absolute;inset:0;width:var(--p,50%);background:var(--grad)}
.phaselbl{display:grid;grid-template-columns:2fr 2fr 4fr 4fr 2fr;gap:4px;font-size:10.5px;color:var(--muted);font-weight:600}

/* ---------- alt sayfa (sheet) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.sheet-wrap.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
.sheet-wrap.open .scrim{opacity:1}
.sheet{position:relative;max-width:600px;width:100%;margin:0 auto;max-height:calc(100% - var(--safe-t) - 18px);background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet-wrap.open .sheet{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0;flex:none}
.sheet .close{position:absolute;right:12px;top:12px;z-index:3}
.sheet .body{overflow-y:auto;padding:12px 16px calc(var(--safe-b) + 24px);-webkit-overflow-scrolling:touch}
.sheet .body::-webkit-scrollbar{display:none}
.sheet h2.title{font-size:30px;text-transform:uppercase;padding-right:44px;margin:6px 0 4px}

/* hareket detayı */
.stage{border-radius:20px;background:#0d0d10;border:1px solid var(--line);overflow:hidden;position:relative}
.stage .fig{width:100%;height:auto}
.stage .ctrls{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.stage .ctrls button{height:32px;min-width:32px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid var(--line2);font-size:12px;font-weight:700;display:grid;place-items:center}
.stage .badge{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:8px;background:rgba(255,59,48,.85);display:flex;align-items:center;gap:5px}
.stage .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.frames figure{margin:0;border-radius:14px;overflow:hidden;background:#0d0d10;border:1px solid var(--line);position:relative}
.frames figcaption{position:absolute;left:8px;top:6px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.vidbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.vidbtns a{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.vidbtns a svg{width:20px;height:20px;color:#ff3b30}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.kv .up{color:var(--muted);font-size:10px}
.kv b{display:block;font-family:var(--display);font-size:20px;margin-top:3px}
.bodywrap{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 6px 4px}
.bodymap{width:100%;height:auto}
.bodymap .bm-label{fill:var(--muted2);font:700 11px var(--body);letter-spacing:.2em}
.bodymap path[data-m]{stroke:#0b0b0d;stroke-width:1.1;transition:fill .2s}
.bodymap .bm-pri{filter:url(#bmGlow)}
.bodymap.interactive path[data-m]{cursor:pointer}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin:4px 0 6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink2)}
ol.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;font-family:var(--display);font-weight:800;display:grid;place-items:center;font-size:15px}
ul.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.notes li{display:flex;gap:10px;font-size:14.5px;color:var(--ink2)}
ul.notes li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:8px;background:var(--orange)}
ul.notes.bad li::before{background:#ff3b30;border-radius:1px;transform:rotate(45deg)}
.callout{border-radius:16px;padding:12px 14px;background:var(--grad-soft);border:1px solid rgba(255,90,31,.3);font-size:14px;color:#ffd9c4}

/* formlar */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.input{height:48px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);padding:0 14px;font-size:17px;width:100%}
.input:focus{border-color:rgba(255,122,26,.6);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.toggle+.toggle{margin-top:8px}
.toggle .sw{width:46px;height:28px;border-radius:14px;background:var(--surface3);position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on .sw{background:var(--grad)}
.toggle.on .sw::after{transform:translateX(18px)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{height:46px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);font-weight:700;font-size:13px}
.daypick button.on{background:var(--grad);border:0;color:#fff}
.eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eq{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;text-align:left;min-height:52px}
.eq .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.eq.on{border-color:rgba(255,122,26,.45);background:rgba(255,122,26,.07)}
.eq.on .ck{background:var(--grad);border:0}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface3);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);padding:0 14px;margin-bottom:10px}
.search input{flex:1;background:none;border:0;outline:none;font-size:16px}
.search svg{width:18px;height:18px;color:var(--muted)}
.hscroll{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}

/* ---------- oynatıcı (antrenman modu) ---------- */
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;max-width:600px;margin:0 auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.player.open{transform:none}
.player .ptop{padding:calc(var(--safe-t) + 8px) 16px 8px;display:flex;align-items:center;gap:10px}
.player .ptop .grow{text-align:center}
.player .ptop .num{font-size:22px}
.pbar{height:4px;margin:0 16px;border-radius:2px;background:var(--surface3);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grad);transition:width .3s}
.pbody{flex:1;overflow-y:auto;padding:12px 16px 12px;display:flex;flex-direction:column}
.pbody::-webkit-scrollbar{display:none}
.pfoot{padding:10px 16px calc(var(--safe-b) + 12px);display:flex;gap:10px;border-top:1px solid var(--line);background:var(--bg2)}
.pfoot .btn{flex:1;height:46px;font-size:14px}
.phase-lbl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.pname{font-size:34px;text-transform:uppercase;margin:4px 0 2px;line-height:.95}
.pstage{border-radius:22px;overflow:hidden;background:#0d0d10;border:1px solid var(--line);margin:10px 0;position:relative}
.pstage .fig{width:100%;height:auto;max-height:34vh}
.pstage .info{position:absolute;right:8px;top:8px}
.pstage.short .fig{max-height:22vh}
.setdots{display:flex;gap:6px;margin:6px 0 10px}
.setdots i{flex:1;height:6px;border-radius:3px;background:var(--surface3)}
.setdots i.done{background:var(--grad)}
.setdots i.cur{background:rgba(255,122,26,.5);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.target{display:flex;align-items:baseline;gap:8px;margin:2px 0 6px}
.target .num{font-size:56px;line-height:.9}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.stepper{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.stepper .up{color:var(--muted)}
.stepper .ctl{display:flex;align-items:center;gap:8px;width:100%}
.stepper .ctl button{width:40px;height:40px;border-radius:12px;background:var(--surface3);font-size:22px;font-weight:600;flex:none}
.stepper .ctl .v{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:30px}
.stepper .hint{font-size:11.5px;color:var(--orange);font-weight:600;text-align:center;min-height:14px}
.ring{position:relative;width:min(62vw,250px);aspect-ratio:1;margin:8px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c .num{font-size:64px;line-height:.9}
.ring .c .up{color:var(--muted)}
.ring.rest .c .num{color:var(--ink)}
.watch{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600;margin:4px 0}
.watch .num{color:var(--ink);font-size:20px}
.nextup{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-top:10px}
.nextup .thumb{width:84px;height:70px;border-radius:12px;overflow:hidden;background:#0d0d10;flex:none}
.blocks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.block{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.block.cur{border-color:rgba(255,122,26,.6);background:rgba(255,122,26,.08)}
.block.past{opacity:.45}
.block.hard b{color:var(--orange)}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.feel button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted)}
.feel button span{font-size:26px}
.feel button.on{border-color:rgba(255,122,26,.7);background:rgba(255,122,26,.12);color:var(--ink)}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}

/* rozetler */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge-i{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.15}
.badge-i .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--surface3);filter:grayscale(1);opacity:.5}
.badge-i.on{color:var(--ink)}
.badge-i.on .ic{background:var(--grad);filter:none;opacity:1;box-shadow:0 0 16px rgba(255,90,31,.55)}

/* grafik */
.chart{width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted2);font:600 10px var(--body)}
.heat{display:grid;grid-template-columns:auto repeat(12,1fr);gap:4px;align-items:center}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface2)}
.heat i.t{background:var(--surface3);box-shadow:inset 0 0 0 1.5px rgba(255,122,26,.35)}
.heat i.d{background:var(--grad)}
.heat i.m{background:rgba(255,59,48,.22)}
.heat span{font-size:9.5px;color:var(--muted2);font-weight:700;padding-right:4px}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,-140%);z-index:100;max-width:calc(100% - 32px);padding:12px 16px;border-radius:16px;background:rgba(24,24,29,.96);border:1px solid rgba(255,122,26,.45);box-shadow:0 10px 40px rgba(0,0,0,.6);font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:translate(-50%,0)}
.toast .ic{font-size:22px}

/* karşılama */
.onb{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;max-width:600px;margin:0 auto}
.onb .ob-body{flex:1;overflow-y:auto;padding:calc(var(--safe-t) + 24px) 20px 20px}
.onb .ob-foot{padding:12px 20px calc(var(--safe-b) + 16px)}
.onb .dots{display:flex;gap:6px;margin-bottom:22px}
.onb .dots i{flex:1;height:4px;border-radius:2px;background:var(--surface3)}
.onb .dots i.on{background:var(--grad)}
.onb h1{font-size:46px;text-transform:uppercase;line-height:.92;margin-bottom:10px}
.onb .lead{color:var(--ink2);font-size:16px;margin-bottom:22px}
.splash-fig{margin:10px -20px 0;position:relative}
.splash-fig .fig{width:100%}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}
a{color:var(--orange)}
@media (min-width:600px){#app,.tabs,.player,.onb{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
